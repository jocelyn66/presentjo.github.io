baseURL: https://jocelyn66.github.io/presentjo.github.io/
title: PresentJo
locale: zh-CN
defaultContentLanguage: zh
hasCJKLanguage: true
timeZone: Asia/Shanghai
theme: PaperMod
enableRobotsTXT: true
pagination:
  pagerSize: 10
outputs:
  home:
    - HTML
    - RSS
    - JSON
params:
  env: production
  description: 文章与笔记
  defaultTheme: auto
  ShowReadingTime: true
  ShowWordCount: true
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  ShowToc: true
  mainSections:
    - posts
  homeInfoParams:
    Title: PresentJo
    Content: 文章与笔记。
  socialIcons:
    - name: github
      url: https://github.com/jocelyn66
    - name: rss
      url: https://jocelyn66.github.io/presentjo.github.io/index.xml
menu:
  main:
    - name: 文章
      url: /posts/
      weight: 10
    - name: 归档
      url: /archives/
      weight: 20
    - name: 标签
      url: /tags/
      weight: 30
    - name: 搜索
      url: /search/
      weight: 40
markup:
  highlight:
    noClasses: false
caches:
  images:
    dir: :cacheDir/images
